name: Build and push Huawei SWR

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push (default: latest)"
        required: false
        default: "latest"

permissions:
  contents: read

env:
  SWR_REGISTRY: swr.cn-east-3.myhuaweicloud.com
  SWR_REGION: cn-east-3
  IMAGE_NAME: dlmodel

jobs:
  build-push:
    runs-on: ubuntu-latest
    # Fail loudly instead of hanging: a stalled SWR round trip once left the job
    # running for three quarters of an hour with no signal, which reads as "the
    # release is coming" to everyone but the person watching the registry. The push
    # step below carries its own per-attempt deadline, so this only has to bound the
    # whole job.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          NS="${{ vars.HW_SWR_NAMESPACE }}"
          if [ -z "$NS" ]; then
            NS="${{ secrets.HW_SWR_NAMESPACE }}"
          fi
          if [ -z "$NS" ]; then
            NS="sreyun"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            TAG="${TAG:-latest}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          REPO="${SWR_REGISTRY}/${NS}/${IMAGE_NAME}"
          {
            echo "namespace=${NS}"
            echo "tag=${TAG}"
            echo "repo=${REPO}"
            echo "image_tag=${REPO}:${TAG}"
            echo "image_latest=${REPO}:latest"
          } >> "$GITHUB_OUTPUT"
          echo "Will push: ${REPO}:${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Huawei SWR
        shell: bash
        env:
          HW_ACCESS_KEY: ${{ secrets.HW_ACCESS_KEY }}
          HW_SECRET_KEY: ${{ secrets.HW_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${HW_ACCESS_KEY:-}" ] || [ -z "${HW_SECRET_KEY:-}" ]; then
            echo "Missing HW_ACCESS_KEY / HW_SECRET_KEY repository secrets." >&2
            exit 1
          fi
          # Huawei SWR long-term login password = HMAC-SHA256(SK, AK) as hex
          LOGIN_PASS="$(printf '%s' "$HW_ACCESS_KEY" | openssl dgst -binary -sha256 -hmac "$HW_SECRET_KEY" | xxd -p -c 256)"
          # The registry occasionally answers nothing at all ("Client.Timeout exceeded
          # while awaiting headers"); one blip must not cost a release.
          for attempt in 1 2 3; do
            if printf '%s' "$LOGIN_PASS" | timeout 90 docker login -u "${SWR_REGION}@${HW_ACCESS_KEY}" --password-stdin "$SWR_REGISTRY"; then
              exit 0
            fi
            echo "SWR login failed (attempt $attempt/3); retrying…" >&2
            sleep 10
          done
          echo "SWR login failed after 3 attempts." >&2
          exit 1

      # Build and push are separate on purpose. `buildx --push` uploads while it
      # exports, so one stalled connection burns the entire build again; exporting to
      # the daemon first lets a plain `docker push` retry skip every layer the
      # registry already has.
      - name: Build image
        uses: docker/build-push-action@v6
        timeout-minutes: 15
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: |
            ${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Push to Huawei SWR
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          push_one() {
            local image="$1" attempt
            for attempt in 1 2 3 4 5; do
              echo "Pushing ${image} (attempt ${attempt}/5)…"
              # `timeout` guards a half-open connection that would otherwise sit there
              # until the runner is reclaimed; docker push resumes past any layer the
              # registry already accepted, so a retry is cheap.
              if timeout 420 docker push "${image}"; then
                return 0
              fi
              echo "push failed (attempt ${attempt}/5), backing off…" >&2
              sleep $((attempt * 15))
            done
            return 1
          }
          # Pinned tag first: it is the release artefact. `latest` shares every blob
          # with it, so that push is a manifest-only round trip.
          push_one "${{ steps.meta.outputs.image_tag }}"
          push_one "${{ steps.meta.outputs.image_latest }}"

      - name: Verify the pushed manifest
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # Ask the registry, not the local daemon: the release is only real once the
          # manifest answers there.
          docker buildx imagetools inspect "${{ steps.meta.outputs.image_tag }}"
          docker buildx imagetools inspect "${{ steps.meta.outputs.image_latest }}" >/dev/null

      - name: Summary
        run: |
          {
            echo "## Huawei SWR image"
            echo ""
            echo "- Registry: \`${SWR_REGISTRY}\`"
            echo "- Namespace: \`${{ steps.meta.outputs.namespace }}\`"
            echo "- Tags: \`${{ steps.meta.outputs.tag }}\`, \`latest\`"
            echo "- Pull: \`docker pull ${{ steps.meta.outputs.image_latest }}\`"
            echo "- Prod: \`docker login ${SWR_REGISTRY} && docker compose up -d\`"
            echo "- Prod (pinned): \`DLMODEL_IMAGE=${{ steps.meta.outputs.image_tag }} docker compose up -d\`"
          } >> "$GITHUB_STEP_SUMMARY"
