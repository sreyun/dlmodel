name: CI

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:
  # Lets the release workflow run the same gate before it builds an image.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt

      - name: Install
        run: pip install -c constraints.txt -e ".[dev]"

      - name: Lint
        run: ruff check app tests

      - name: Test
        run: pytest -q
