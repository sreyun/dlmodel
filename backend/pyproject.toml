[project]
name = "dlmodel"
version = "0.1.0"
description = "Local model download manager for vLLM/Ollama with China mirrors"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.4.0",
  "aiosqlite>=0.20.0",
  "huggingface_hub>=0.24.0",
  "modelscope>=1.18.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
