[project]
name = "dlmodel"
version = "0.1.0"
description = "Local model download manager for vLLM/Ollama with China mirrors"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1",
  "uvicorn[standard]>=0.30.0,<1",
  "httpx>=0.27.0,<1",
  "pydantic-settings>=2.4.0,<3",
  "aiosqlite>=0.20.0,<1",
  "huggingface_hub>=0.24.0,<3",
  "modelscope>=1.18.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10", "pytest-asyncio>=0.23,<2", "respx>=0.21,<1", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
