# Production stack (default). Usage:
#   cp .env.example .env   # set a strong ADMIN_TOKEN
#   docker login swr.cn-east-3.myhuaweicloud.com
#   docker compose up -d
#
# Override image: DLMODEL_IMAGE=.../dlmodel:vX.Y.Z in .env (pin for rollback).
# Local development (build from source, bind localhost):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

x-web-env: &web-env
  MODEL_ROOT: ${MODEL_ROOT:-/models}
  DATA_DIR: ${DATA_DIR:-/data}
  HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
  HF_TOKEN: ${HF_TOKEN:-}
  MODELSCOPE_API_TOKEN: ${MODELSCOPE_API_TOKEN:-}
  ARIA2_RPC_URL: ${ARIA2_RPC_URL:-http://aria2:6800/jsonrpc}
  ARIA2_RPC_SECRET: ${ARIA2_RPC_SECRET:-dlmodel}
  DOWNLOAD_CONCURRENCY: ${DOWNLOAD_CONCURRENCY:-2}
  ARIA2_CONNECTIONS: ${ARIA2_CONNECTIONS:-16}
  DOWNLOAD_RETRIES: ${DOWNLOAD_RETRIES:-3}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  VLLM_BASE_URL: ${VLLM_BASE_URL:-http://vllm:8000}
  ADMIN_TOKEN: ${ADMIN_TOKEN:-changeme}
  ALLOW_INSECURE_ADMIN: ${ALLOW_INSECURE_ADMIN:-0}

x-json-log: &json-log
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  web:
    image: ${DLMODEL_IMAGE:-swr.cn-east-3.myhuaweicloud.com/sreyun/dlmodel:latest}
    pull_policy: always
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:8080"
    environment:
      <<: *web-env
    env_file:
      - .env
    volumes:
      - ${HOST_MODEL_ROOT:-./data/models}:/models
      - ${HOST_DATA_DIR:-./data/app}:/data
    depends_on:
      aria2:
        condition: service_started
    networks: [dlmodel]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging: *json-log

  aria2:
    image: ${ARIA2_IMAGE:-p3terx/aria2-pro:latest}
    environment:
      RPC_SECRET: ${ARIA2_RPC_SECRET:-dlmodel}
      RPC_PORT: 6800
      # Match web so RPC writes succeed under the shared /models mount.
      PUID: ${ARIA2_PUID:-0}
      PGID: ${ARIA2_PGID:-0}
    volumes:
      - ${HOST_MODEL_ROOT:-./data/models}:/models
      - ${HOST_ARIA2_DIR:-./data/aria2}:/config
    networks: [dlmodel]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ollama:
    profiles: ["ollama"]
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    ports:
      - "${OLLAMA_BIND:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ${HOST_MODEL_ROOT:-./data/models}/ollama:/root/.ollama
    networks: [dlmodel]
    restart: unless-stopped

  vllm:
    profiles: ["vllm"]
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    runtime: ${VLLM_RUNTIME:-nvidia}
    ports:
      - "${VLLM_BIND:-127.0.0.1}:${VLLM_PORT:-8000}:8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${HOST_MODEL_ROOT:-./data/models}/hf:/models/hf
    command:
      [
        "--model",
        "${VLLM_MODEL:-/models/hf}",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    networks: [dlmodel]
    restart: unless-stopped

networks:
  dlmodel:
    driver: bridge
